name: Deploy recette web to VPS

# La version web EST notre environnement de recette (les apps iOS/Android
# partiront en prod au dernier moment, buildées via EAS).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-cardtrade-recette
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash /var/www/cardtrade/deploy/recette.sh"
